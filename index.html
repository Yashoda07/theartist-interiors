<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#c98a5a" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <title>The Artist Interiors — Interior Design & 3D Visualization Studio | Mumbai & Pune</title>
    <meta name="description" content="The Artist Interiors by Aadarsh Chaubey — award-quality interior design, 3D visualization and on-site execution for homes across Mumbai, Pune and clients worldwide." />
    <meta name="keywords" content="interior designer Mumbai, interior designer Pune, 3D visualization, site execution, residential interior design, The Artist Interiors, Aadarsh Chaubey" />
    <meta name="author" content="Aadarsh Chaubey" />

    <link rel="canonical" href="https://theartistinteriors.in/" />

    <!-- Preconnect to font + image CDNs — eliminates render-blocking delay -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://i.postimg.cc" crossorigin />
    <link rel="dns-prefetch" href="https://i.postimg.cc" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="The Artist Interiors" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://theartistinteriors.in/" />
    <meta property="og:title" content="The Artist Interiors — Interior Design & 3D Visualization Studio" />
    <meta property="og:description" content="Interior design, 3D visualization and site execution for premium homes across Mumbai, Pune and beyond." />
    <meta property="og:image" content="https://theartistinteriors.in/logo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Artist Interiors — Interior Design & 3D Visualization" />
    <meta name="twitter:description" content="Interior design, 3D visualization and site execution for premium homes across Mumbai, Pune and beyond." />
    <meta name="twitter:image" content="https://theartistinteriors.in/logo.png" />

    <!-- Icons & manifest -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Structured data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "The Artist Interiors",
        "url": "https://theartistinteriors.in",
        "logo": "https://theartistinteriors.in/logo.png",
        "founder": { "@type": "Person", "name": "Aadarsh Chaubey" },
        "description": "Interior Design Studio specialized in Interior Designing & 3D Visualization.",
        "sameAs": []
      }
    </script>

    <!-- Structured data: LocalBusiness -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "The Artist Interiors",
        "image": "https://theartistinteriors.in/logo.png",
        "url": "https://theartistinteriors.in",
        "priceRange": "$$",
        "areaServed": ["Mumbai", "Pune", "India", "Worldwide"],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Mumbai",
          "addressRegion": "Maharashtra",
          "addressCountry": "IN"
        }
      }
    </script>

    <!-- Inline boot styles + loader: shown instantly, prevents grey flash on refresh -->
    <style>
      html, body { background: hsl(30, 25%, 96%); margin: 0; }
      #app-boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: hsl(30, 25%, 96%); z-index: 9999; transition: opacity .35s ease;
      }
      #app-boot .ring {
        width: 38px; height: 38px; border-radius: 50%;
        border: 2px solid hsl(28, 45%, 45%); border-top-color: transparent;
        animation: app-spin .8s linear infinite;
      }
      @keyframes app-spin { to { transform: rotate(360deg); } }
      #root:not(:empty) + #app-boot { opacity: 0; pointer-events: none; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div id="app-boot" aria-hidden="true"><div class="ring"></div></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove the boot loader once React has mounted content
      const obs = new MutationObserver(() => {
        const root = document.getElementById('root');
        if (root && root.childElementCount > 0) {
          const boot = document.getElementById('app-boot');
          if (boot) { boot.style.opacity = '0'; setTimeout(() => boot.remove(), 350); }
          obs.disconnect();
        }
      });
      obs.observe(document.getElementById('root'), { childList: true });
      setTimeout(() => { const b = document.getElementById('app-boot'); if (b) b.remove(); }, 5000);
    </script>
  </body>
</html>
